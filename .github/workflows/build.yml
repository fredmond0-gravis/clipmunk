name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        shell: cmd
        run: call package.cmd

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Clipmunk
          path: dist/Clipmunk.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Clipmunk.zip \
            --title "Clipmunk $GITHUB_REF_NAME" \
            --notes "Download **Clipmunk.zip**, unzip it, and double-click **Install Clipmunk.cmd**. Then press Print Screen."
